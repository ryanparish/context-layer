# Full stack for a test/VPS host: Postgres + Redis + app.
# Usage:
#   1. Copy env below into a .env file next to this file (or use --env-file).
#   2. docker compose -f docker-compose.stack.yml --env-file .env up -d
#   3. Run migrations once: docker compose -f docker-compose.stack.yml run --rm app \
#        node scripts/db-bootstrap.mjs
#      (or run db-bootstrap from CI against DATABASE_URL)

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: context
      POSTGRES_PASSWORD: context
      POSTGRES_DB: context_layer
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      # Plain HTTP (e.g. http://test-server-ip:3000): must be false or the session cookie is dropped.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      - db
      - redis

volumes:
  db_data:
  redis_data:
